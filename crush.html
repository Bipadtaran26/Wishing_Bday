<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 💜</title>
    <link rel="stylesheet" href="crush_stylle.css">
</head>
<body>
    <div class="card">
        <h1>Happy Birthday Tuhi_naa 💜</h1>
        <p class="subtitle">A little wish just for you...</p>

        <div class="cake" id="cake">
            <div class="candle" id="candle">
                <div class="flame" id="flame"></div>
            </div>
            <div class="layer layer-top"></div>
            <div class="layer layer-middle"></div>
            <div class="layer layer-bottom"></div>
            <div class="plate"></div>
        </div>

        <div class="message">
            <span id="typed"></span><span class="typed-cursor" id="cursor"></span>
        </div>

        <div class="signature">
            <span class="big-heart">💜</span><br>
            From someone who thinks you're <strong>pretty special</strong>
        </div>

        <button class="wish-btn" id="wishBtn">Make a Wish 🎉</button>
        <p class="hint">(Tap on the flame to blow the candle)</p>
    </div>

    <a href="index.html" class="back-link">← Back to envelope</a>

    <script src="main.js"></script>
</body>
</html>
